# Stack Docker de l'application.
# Ollama tourne dans son propre conteneur, séparé de l'image de l'application.
#
# Lancement : docker compose up --build
# Application : http://localhost:${DESCRIPTEUR_PORT:-8080}
# Au premier démarrage, le modèle llava doit être téléchargé une fois :
#   docker compose exec ollama ollama pull llava

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_donnees:/root/.ollama
    environment:
      # Garde le modèle en mémoire : évite un long rechargement après une pause
      OLLAMA_KEEP_ALIVE: "-1"
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all

  application:
    build: .
    depends_on:
      - ollama
    ports:
      # Port de l'hôte (paramétrable) vers le port 8080 du conteneur
      - "${DESCRIPTEUR_PORT:-8080}:8080"
    environment:
      # Ollama : par défaut le conteneur ci-dessus ; pour un Ollama sur une autre machine,
      # définir DESCRIPTEUR_OLLAMA_HOTE (et DESCRIPTEUR_OLLAMA_PORT) et lancer avec --no-deps
      # Sans profil (valeur par défaut), l'implémentation réelle est utilisée ; PROFIL=faux active la fausse
      SPRING_PROFILES_ACTIVE: ${PROFIL:-}
      DESCRIPTEUR_PORT: "8080"
      DESCRIPTEUR_OLLAMA_HOTE: ${DESCRIPTEUR_OLLAMA_HOTE:-ollama}
      DESCRIPTEUR_OLLAMA_PORT: ${DESCRIPTEUR_OLLAMA_PORT:-11434}
      # Modèle de vision utilisé (paramétrable), à télécharger dans le conteneur ollama
      DESCRIPTEUR_OLLAMA_MODELE: ${DESCRIPTEUR_OLLAMA_MODELE:-llava}
    restart: unless-stopped

volumes:
  ollama_donnees:
