# Stack Docker de l'application.
# Ollama n'est pas encore intégré à cette stack : il sera ajouté plus tard, dans son propre conteneur.
#
# Lancement : docker compose up --build
# Application : http://localhost:${DESCRIPTEUR_PORT:-8080}

services:
  application:
    build: .
    ports:
      # Port de l'hôte (paramétrable) vers le port 8080 du conteneur
      - "${DESCRIPTEUR_PORT:-8080}:8080"
    environment:
      # Sans Ollama, on utilise la fausse implémentation par défaut
      SPRING_PROFILES_ACTIVE: ${PROFIL:-faux}
      DESCRIPTEUR_PORT: "8080"
    restart: unless-stopped
