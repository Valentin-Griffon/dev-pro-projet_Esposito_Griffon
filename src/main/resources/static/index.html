<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Décrire une image à voix haute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Décrire une image</h1>
    </header>

    <main>
        <!-- data-voix : phrase lue à voix haute quand le contrôle reçoit le focus (voir app.js) -->
        <form id="formulaire">
            <label for="image">Image à décrire</label>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp,image/gif" required
                   data-voix="Choix de l'image. Appuyez sur Entrée pour ouvrir l'explorateur de fichiers et sélectionner une image.">

            <label for="question">Question sur l'image (facultatif)</label>
            <input type="text" id="question" name="question" maxlength="500"
                   data-voix="Question facultative sur l'image. Écrivez votre question, ou passez au bouton suivant pour une description générale.">

            <div class="boutons">
                <button type="submit" id="analyser"
                        data-voix="Bouton Analyser l'image. Appuyez sur Entrée pour envoyer l'image et entendre sa description.">Analyser l'image</button>
                <button type="button" id="relire" disabled
                        data-voix="Bouton Relire la description. Appuyez sur Entrée pour réécouter la description.">Relire la description</button>
                <button type="button" id="arreter"
                        data-voix="Bouton Arrêter la lecture. Appuyez sur Entrée pour couper la voix.">Arrêter la lecture</button>
            </div>
        </form>

        <!-- Les messages d'état et la description sont annoncés par le lecteur d'écran -->
        <p id="statut" role="status" aria-live="polite"></p>
        <div id="resultat" aria-live="polite"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
