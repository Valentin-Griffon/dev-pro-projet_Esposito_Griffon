spring.application.name=descripteur-image

# Port HTTP de l'application, réglable par variable d'environnement (DESCRIPTEUR_PORT)
server.port=${DESCRIPTEUR_PORT:8080}

# Limite fixée volontairement : une photo de téléphone peut dépasser 1 Mo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Agent réel (profil par défaut) : Ollama, à l'adresse, au port et au modèle réglables
# par variable d'environnement (DESCRIPTEUR_OLLAMA_HOTE, DESCRIPTEUR_OLLAMA_PORT, DESCRIPTEUR_OLLAMA_MODELE)
descripteur.ollama.hote=${DESCRIPTEUR_OLLAMA_HOTE:127.0.0.1}
descripteur.ollama.port=${DESCRIPTEUR_OLLAMA_PORT:11434}
descripteur.ollama.url=http://${descripteur.ollama.hote}:${descripteur.ollama.port}
descripteur.ollama.modele=${DESCRIPTEUR_OLLAMA_MODELE:llava}
descripteur.ollama.delai=2m
