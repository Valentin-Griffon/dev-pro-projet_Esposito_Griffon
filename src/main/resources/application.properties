spring.application.name=descripteur-image

# Limite fixée volontairement : une photo de téléphone peut dépasser 1 Mo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Agent réel (profil par défaut) : Ollama en local
descripteur.ollama.url=http://localhost:11434
descripteur.ollama.modele=llava
descripteur.ollama.delai=2m
